<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Juice</title></head>
<body><p>Opening Font Juice…</p><p><a id="go" href="./">Open Font Juice</a></p>
<script>
(async()=>{
  const target=new URL('./',location.href);target.search=location.search;target.hash=location.hash;
  document.getElementById('go').href=target.href;
  // Old workers redirected root -> working.html. Retire them before going back.
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r=>r.scope===target.origin+target.pathname).map(r=>r.unregister()));
    }
    if('caches' in globalThis){
      const names=await caches.keys();
      await Promise.all(names.filter(name=>name.startsWith('font-juice-')).map(name=>caches.delete(name)));
    }
  }catch(error){console.warn(error)}
  location.replace(target.href);
})();
</script>
</body></html>
