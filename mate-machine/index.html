<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="A changing dose of mate-grade morale.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=3">
  <title>MATE MACHINE</title>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-live="polite" aria-atomic="true">
      <header class="topline">
        <span>FOR <b id="to">MATE</b></span>
        <span id="count">DOSE 001</span>
      </header>

      <div class="body" id="body">
        <div id="icon" class="icon" aria-hidden="true">🫶</div>
        <div id="badge" class="badge">PROPER</div>
        <p id="opener" class="opener">Official reminder:</p>
        <h1 id="main" class="mainline">You matter more than today's bullshit suggests.</h1>
        <p id="support" class="support">No brave face is required.</p>
        <p id="closer" class="closer">That is the whole memo.</p>
      </div>

      <footer class="foot">
        <p id="from" class="from">From Adam — firmly in your corner.</p>
        <button id="again" class="again" type="button">ANOTHER ONE</button>
      </footer>
    </section>
    <p class="hint">Tap the NFC again. Or press the button. The machine has millions. No repeats for years.</p>
  </main>

  <noscript>This needs JavaScript enabled.</noscript>
  <script src="./content.js?v=3"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
