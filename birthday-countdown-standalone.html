<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIMI 21 Countdown</title></head><body style="margin:0;background:#101113;color:#fff;font-family:system-ui;min-height:100svh;display:grid;place-items:center;text-align:center"><main><p style="letter-spacing:.2em;color:#aaa;font-weight:900">MIMI 21</p><h1 id="h" style="font-size:14vw;line-height:.85;margin:0">Countdown</h1><div id="d" style="font-size:22vw;font-weight:1000">--</div><p>days</p><p id="t" style="font-size:7vw;font-weight:900">--:--:--</p><p><a style="color:#111;background:#fff;padding:14px 18px;border-radius:14px;font-weight:900;text-decoration:none" href="mimi21/?fish=the-twenty-one&set=21_v2">Open fish</a></p></main><script>const T=new Date('2026-07-21T00:00:00+10:00');function tick(){const x=T-new Date();if(x<=0){h.textContent='MIMI 21 IS LIVE';d.textContent='00';t.textContent='FIRST EDITION / ONE OF ONE';return}const s=Math.floor(x/1000),days=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;h.textContent=days+' days to go';d.textContent=String(days).padStart(2,'0');t.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')}tick();setInterval(tick,1000)</script></body></html>
