<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mimi 21">
  <title>Mimi 21 Router</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101113;color:#f5f6f7}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -20%,#30343d 0,#101113 45%)}
    main{width:min(720px,100%);border:1px solid #ffffff22;border-radius:24px;background:#191b1ecc;padding:24px;box-shadow:0 22px 80px #0008}
    .eyebrow{margin:0 0 10px;color:#a7abb2;font-weight:950;letter-spacing:.2em;font-size:.78rem}h1{margin:0;font-size:clamp(2.2rem,10vw,5.6rem);line-height:.9;letter-spacing:-.07em}p{color:#a7abb2;line-height:1.5}.fish{font:900 clamp(1.6rem,10vw,4rem)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;letter-spacing:-.08em;white-space:nowrap;overflow:auto}a{color:#fff;font-weight:900}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">MIMI 21 ROUTER</p>
    <h1>Opening fish…</h1>
    <p class="fish">&gt;&lt;)))21&gt;</p>
    <p id="message">Sending this NFC tag to the working composer.</p>
    <p><a id="fallback" href="working.html">Open manually</a></p>
  </main>
  <script>
    (function(){
      var target=new URL('working.html', location.href);
      target.search=location.search;
      target.hash=location.hash;
      document.getElementById('fallback').href=target.href;
      document.getElementById('message').textContent='Sending this NFC tag to '+target.pathname+target.search;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
