    <p class="fish" aria-label="Mimi 21 fish code">&gt;&lt;)))21&gt;</p>

  <footer>
    <span id="targetText">Target: 21 July 2026, Sydney time</span>
    <a href="../index.html?fish=the-twenty-one&amp;set=21_v2">Open THE TWENTY-ONE</a>
